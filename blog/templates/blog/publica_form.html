{% extends "blog/base.html" %}
{% block content %}
<h1>{% if object %}Editar Publicação{% else %}Nova Publicação{% endif %}</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Salvar</button>
  <a href="{% url 'blog:publica-list' %}">Cancelar</a>
</form>
{% endblock %}
