{% extends "blog/base.html" %}
{% block content %}
<h1>Publicação</h1>
<p>Autor: {{ object.autor.nome }}</p>
<p>Livro: <a href="{% url 'blog:livro-detail' object.livro.pk %}">{{ object.livro.titulo }}</a></p>
<p>
  <a href="{% url 'blog:publica-edit' object.pk %}">Editar</a> |
  <a href="{% url 'blog:publica-delete' object.pk %}">Excluir</a> |
  <a href="{% url 'blog:publica-list' %}">Voltar</a>
</p>
{% endblock %}
