{% extends "blog/base.html" %}
{% block content %}
<h1>Autores</h1>
<a href="{% url 'blog:autor-add' %}">Novo autor</a>
<ul>
  {% for autor in object_list %}
    <li>
      <a href="{% url 'blog:autor-detail' autor.pk %}">{{ autor.nome }}</a>
      - <a href="{% url 'blog:autor-edit' autor.pk %}">editar</a>
      - <a href="{% url 'blog:autor-delete' autor.pk %}">excluir</a>
    </li>
  {% empty %}
    <li>Nenhum autor cadastrado.</li>
  {% endfor %}
</ul>
{% endblock %}
