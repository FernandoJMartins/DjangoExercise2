{% extends 'base.html' %}

{% block content %}
  <h1>Confirmar exclusão</h1>
  <p>Deseja realmente excluir o livro: "{{ object.titulo }}" {% if object.ISBN %}({{ object.ISBN }}){% endif %}?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn-delete">Sim, excluir</button>
    <a href="{% url 'blog:livro-list' %}">Cancelar</a>
  </form>
{% endblock %}
