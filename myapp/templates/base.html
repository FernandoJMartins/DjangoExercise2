{% load static %}

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CRUD Livros</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{% static 'blog/styles.css' %}">
</head>
<body>
  <nav>
    <div class="nav-left">
      <a href="{% url 'blog:home' %}">Home</a>
      <a href="{% url 'blog:livro-list' %}">Livros</a>
    </div>
    <div class="nav-right">
      {% if user.is_authenticated %}
        <span class="user-info">Olá, {{ user.username }}</span>
        <a href="{% url 'blog:logout' %}" class="btn-logout">Sair</a>
      {% else %}
        <a href="{% url 'blog:signin' %}">Entrar</a>
        <a href="{% url 'blog:signup' %}">Criar Conta</a>
      {% endif %}
    </div>
  </nav>
  <hr>
  {% block content %}{% endblock %}
</body>
</html>
